<mat-card>
  <mat-card-header>
    <div mat-card-avatar class="card-header-container">
      <div>
        <mat-icon (click)="goBack()" class="BackIcon"
          >keyboard_backspace</mat-icon
        ><mat-card-title class="header">Offer Details </mat-card-title>
      </div>
      <div *ngFor="let detail of interviewDetails">
        <mat-card-subtitle class="flex-container">
          <span><strong>College Name:</strong>{{ detail.CollegeName }}</span>
          <span><strong>Student Name:</strong>{{ detail.StudentName }}</span>
        </mat-card-subtitle>
        <mat-card-subtitle class="flex-container">
          <span><strong>Branch:</strong>{{ detail.Branch }}</span>
          <span><strong>Job Id:</strong> {{ detail.JobId }}</span>
        </mat-card-subtitle>
        <mat-card-subtitle class="flex-container">
          <span><strong>Batch:</strong>{{ detail.Batch }}</span>
          <span><strong>Job Role:</strong>{{ detail.JobRole }}</span>
        </mat-card-subtitle>
      </div>
    </div>
  </mat-card-header>
  <mat-card-content class="table-container">
    <table
      mat-table
      [dataSource]="detailsDataSource"
      class="student-table mat-elevation-z8"
      *ngIf="true"
    >
      <ng-container *ngFor="let column of columns" [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef>{{ column.label }}</th>
        <td mat-cell *matCellDef="let element">
          <ng-container [ngSwitch]="column.key">
            <ng-container *ngSwitchDefault>
              {{ element[column.key] }}
            </ng-container>
          </ng-container>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>
