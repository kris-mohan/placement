<mat-card>
  <mat-card-header class="custom-card-header">
    <div class="example-button-row">
      <div class="example-flex-container">
        <div class="button-label-container">
          <!-- <div class="example-button-container" (click)="goBack()">
            <mat-icon>keyboard_backspace</mat-icon>
          </div> -->
          <div class="header-mat-label">
            <mat-label>INDENT VIEW</mat-label>
          </div>
        </div>
        <div class="example-button-container">
          <button
            mat-fab
            extended
            class="matbutton-download"
            (click)="exportIndentData()"
          >
            <mat-icon>file_download</mat-icon>Excel
          </button>
          <button mat-fab extended class="matbutton-download">
            <mat-icon>picture_as_pdf</mat-icon>
            <h5>PDF</h5>
          </button>
          <button
            mat-raised-button
            class="matbutton"
            (click)="openAddEditIndentForm()"
          >
            <mat-icon class="maticon">add</mat-icon>
            <p class="matButtonText">Add Indent</p>
          </button>
        </div>
      </div>
    </div>
  </mat-card-header>
  <div *ngIf="isLoading" class="spinner-container">
    <mat-spinner></mat-spinner>
  </div>
  <div *ngIf="!isLoading"></div>

  <mat-card-content
    fxLayout="row wrap"
    fxLayoutAlign="start stretch"
    class="mat-card-content"
  >
    <div
      *ngFor="let indent of indentdata"
      fxFlex="100%"
      fxFlex.gt-sm="50%"
      fxFlex.gt-md="28%"
      fxFlex.gt-lg="25%"
      class="grid-item"
      class="mat-grid-tile"
      (click)="openAddEditIndentForm(indent.Id)"
    >
      <div class="company-details">
        <p><strong>Company Designation:</strong></p>
        <h3>{{ indent.ContactPersonDesignation }}</h3>
        <div class="company-type">
          <p><strong>Company Name:</strong> {{ indent.CompanyName }}</p>
        </div>

        <p><strong>Email:</strong> {{ indent.Email }}</p>
      </div>

      <div class="company">
        <p><strong>Phone No:</strong> {{ indent.PhoneNumber }}</p>
        <div *ngIf="UserRoleId !== 3">
          <!-- <p>
            <strong>Required Items:</strong>
            {{ indent.RequiredItem }}
          </p> -->
          <!-- <p>
            <strong>Quantity:</strong>
            {{ indent.Quatity }}
          </p> -->
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
