<div class="dialog-container">
  <div class="dialog-header">
    <h3>Students Notification</h3>
  </div>
  <div class="dialog-body">
    <!-- <mat-form-field appearance="outline" class="full-width">
      <mat-label>Select Template</mat-label>
      <mat-select>
        <mat-option *ngFor="let template of templates" [value]="template.id">
          {{ template.Name }}
        </mat-option>
      </mat-select>
    </mat-form-field> -->
    <mat-form-field appearance="outline" class="mat-select large-input">
      <mat-label>Choose the Template</mat-label>
      <mat-select (selectionChange)="onTemplateChange($event.value)">
        <mat-option *ngFor="let template of templates" [value]="template.Id">
          {{ template.Name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <div *ngIf="selectedTemplate" class="offer-letter-card">
      <mat-card class="offer-letter-card-container centered-content">
        <mat-card-header>
          <mat-card-title>{{ templateSubject }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="template-body" [innerHTML]="templateBody"></div>
        </mat-card-content>
      </mat-card>
    </div>
    <div class="dialog-footer">
      <button mat-raised-button color="primary" (click)="onReset()">
        Reset
      </button>
      <button mat-raised-button color="primary" >Send</button>
    </div>
  </div>
</div>
