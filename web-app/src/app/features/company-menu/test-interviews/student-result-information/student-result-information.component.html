<mat-card class="mat-card">
  <div class="example-button-container">
    <mat-icon (click)="goBack()" class="BackIcon">keyboard_backspace</mat-icon>
  </div>

  <mat-stepper
    [orientation]="(stepperOrientation | async)!"
    [selectedIndex]="currentRoundIndex()"
    (selectionChange)="onStepChange($event.selectedIndex)">
    <mat-step
      *ngFor="
        let round of JobInterviewRoundsData()[0]?.Jobinterviewrounds;
        let i = index
      "
      [label]="round.Name ? round.Name : 'Undefined'">
      <div>
        <button mat-button matStepperPrevious *ngIf="i > 0">Back</button>
        <button
          mat-button
          matStepperNext
          *ngIf="i < JobInterviewRoundsData()[0].Jobinterviewrounds.length">
          Next
        </button>
      </div>
    </mat-step>
  </mat-stepper>

  <mat-card-content>
    <form class="form-content" [formGroup]="studentResultInformationForm">
      <div class="form-container">
        <mat-card-content>
          <div fxLayout="row wrap">
            <div
              fxFlex="100%"
              fxFlex.gt-md="33%"
              fxFlex.gt-lg="25%"
              fxFlex.gt-sm="50%">
              <div fxLayout="row" fxLayoutAlign="start center">
                <p class="grid-label">Score</p>
                <mat-form-field appearance="outline" class="matFormField">
                  <mat-label> Score</mat-label>
                  <input matInput formControlName="Score" type="number" />
                </mat-form-field>
              </div>
              <div>
                <div>
                  <div
                    fxLayout="row"
                    fxLayoutAlign="start center"
                    style="width: 100%">
                    <p class="grid-labels">Feedback</p>
                    <mat-form-field appearance="outline" class="matFormField">
                      <mat-label> Feedback</mat-label>
                      <textarea
                        matInput
                        formControlName="Feedback"
                        rows="2"></textarea>
                    </mat-form-field>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </mat-card-content>
      </div>

      <mat-card-actions class="footer-actions">
        <button
          mat-raised-button
          class="matbutton"
          (click)="showNotificationPopup()">
          <p class="matName">Send Email</p>
        </button>
        <!-- <button
          mat-raised-button
          color="primary"
          (click)="handleGenerateOffer()"
          *ngIf="
            currentRoundIndex() >
            JobInterviewRoundsData()[0].Jobinterviewrounds.length - 2
          ">
          <p class="matName">Generate offer</p>
        </button> -->
        <button
          mat-raised-button
          color="primary"
          (click)="openMoveToNextRoundOrReject(1)"
          *ngIf="
            currentRoundIndex() <
            JobInterviewRoundsData()[0].Jobinterviewrounds.length - 1
          "
          [disabled]="
            studentResultInformationForm.invalid ||
            !studentResultInformationForm.value.Score ||
            !studentResultInformationForm.value.Feedback
          "
          matTooltip="Enter Score and Feedback to proceed">
          Move to Next Round
        </button>

        <button
          mat-raised-button
          type="submit"
          color="warn"
          (click)="openMoveToNextRoundOrReject(0)"
          [disabled]="
            studentResultInformationForm.invalid ||
            !studentResultInformationForm.value.Score ||
            !studentResultInformationForm.value.Feedback
          "
          disabledInteractive
          matTooltip="Enter Score and Feedback to proceed"
          [disabled]="
            studentResultInformationForm.invalid ||
            !studentResultInformationForm.value.Score ||
            !studentResultInformationForm.value.Feedback
          "
          disabledInteractive
          matTooltip="Enter Score and Feedback to proceed">
          <p class="matName">Reject</p>
        </button>
      </mat-card-actions>
    </form>
  </mat-card-content>
</mat-card>
