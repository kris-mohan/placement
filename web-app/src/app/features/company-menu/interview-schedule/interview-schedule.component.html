<div>
  <h2 class="header-mat-label">Schedule Interview</h2>
</div>
<div style="display: flex">
  <div style="margin: 1rem">
    <mat-form-field
      appearance="outline"
      style="margin-right: 1rem; width: 300px"
    >
      <mat-label>University</mat-label>
      <mat-select multiple>
        <mat-option *ngFor="let uni of universityTypes" [value]="uni">
          {{ uni }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 300px">
      <mat-label>College</mat-label>
      <mat-select multiple>
        <ng-container *ngFor="let college of colleges(); trackBy: trackById">
          <mat-option [value]="college.Id">{{
            college.CollegeName
          }}</mat-option>
        </ng-container>
      </mat-select>
    </mat-form-field>
  </div>
</div>
<div class="main-div">
  <full-calendar class="calendar" [options]="calendarOptions"></full-calendar>
  <div style="margin-left: 0px">
    <mat-card class="outer-card-container">
      <div class="inner-cards-container">
        <mat-card class="example-card" *ngFor="let event of events">
          <mat-card-content class="mat-card-content">
            <div class="company-info">
              <h3>{{ event.jobTitle }}</h3>
              <!-- <p><strong>Job Title:</strong> {{ event.jobTitle }}</p> -->
              <p><strong>Round:</strong> {{ event.Round }}</p>
              <p><strong>Round Name:</strong> {{ event.RoundName }}</p>
            </div>
            <div class="company-timings">
              <p><strong>Event Date:</strong> {{ event.eventDate | date }}</p>
              <p><strong>Timings:</strong> {{ event.timings }}</p>
              <p><strong>Duration:</strong> {{ event.duration }}</p>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </mat-card>
  </div>
</div>
