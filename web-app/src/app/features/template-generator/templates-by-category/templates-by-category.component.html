<mat-card appearance="outlined" class="full-height-card">
  <mat-toolbar class="toolbar">
    <button mat-icon-button (click)="navigateBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span>Templates: {{ templateCategoryDetails()?.Name }}</span>
    <span class="spacer"></span>

    <!-- Search Input -->
    <mat-form-field appearance="outline" class="search-field">
      <mat-icon matPrefix>search</mat-icon>
      <input
        matInput
        type="text"
        placeholder="Search Templates"
        (input)="onSearch($event)"
      />
    </mat-form-field>
  </mat-toolbar>
  <mat-card-content class="scrollable-content">
    <div class="button-container">
      <button
        mat-raised-button
        color="primary"
        (click)="openAddTemplateDialog()"
      >
        <mat-icon>add</mat-icon> Add Template
      </button>
    </div>
    <div>
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        <ng-container matColumnDef="Id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let template">{{ template.Id }}</td>
        </ng-container>

        <ng-container matColumnDef="Name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let template">{{ template.Name }}</td>
        </ng-container>

        <ng-container matColumnDef="Subject">
          <th mat-header-cell *matHeaderCellDef>Subject</th>
          <td mat-cell *matCellDef="let template">
            {{ template.Subject }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element">
            <button
              mat-icon-button
              color="primary"
              (click)="openAddTemplateDialog(element)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              (click)="deleteTemplate(element)"
            >
              <mat-icon>delete</mat-icon>
            </button>
            <button mat-icon-button color="secondary">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <mat-paginator
        [length]="totalCount()"
        [pageSize]="pageSize()"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="onPageChange($event)"
      >
      </mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
