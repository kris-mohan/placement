<mat-card appearance="outlined" class="full-height-card">
  <mat-card-content class="scrollable-content">
    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
      <mat-tab label="Template Categories">
        <div>
          <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
            <ng-container matColumnDef="Id">
              <th mat-header-cell *matHeaderCellDef>ID</th>
              <td mat-cell *matCellDef="let category">{{ category.Id }}</td>
            </ng-container>

            <ng-container matColumnDef="Name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let category">{{ category.Name }}</td>
            </ng-container>

            <ng-container matColumnDef="CreatedAt">
              <th mat-header-cell *matHeaderCellDef>Created At</th>
              <td mat-cell *matCellDef="let category">
                {{ category.CreatedAt | date : "medium" }}
              </td>
            </ng-container>

            <ng-container matColumnDef="UpdatedAt">
              <th mat-header-cell *matHeaderCellDef>Updated At</th>
              <td mat-cell *matCellDef="let category">
                {{ category.UpdatedAt | date : "medium" }}
              </td>
            </ng-container>

            <tr
              mat-header-row
              *matHeaderRowDef="['Id', 'Name', 'CreatedAt', 'UpdatedAt']"
            ></tr>
            <tr
              mat-row
              *matRowDef="
                let row;
                columns: ['Id', 'Name', 'CreatedAt', 'UpdatedAt']
              "
            ></tr>
          </table>

          <mat-paginator
            [length]="totalCount()"
            [pageSize]="pageSize()"
            [pageSizeOptions]="[5, 10, 20]"
            (page)="onPageChange($event)"
          >
          </mat-paginator>
        </div>
      </mat-tab>
      <mat-tab label="Build Template">
        <div>
          <div class="main-container">
            <br />
            <!-- Template Category Dropdown -->
            <mat-form-field class="full-width">
              <mat-label>Template Category</mat-label>
              <input
                type="text"
                matInput
                [matAutocomplete]="auto"
                [(ngModel)]="selectedCategory"
                (input)="onSearch($event)"
              />
              <mat-autocomplete
                #auto="matAutocomplete"
                [displayWith]="displayCategory"
              >
                <mat-option
                  *ngFor="let category of filteredCategories()"
                  [value]="category"
                >
                  {{ category.Name }}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
            <br />
            <mat-form-field class="full-width">
              <mat-label>Subject</mat-label>
              <input matInput type="text" [(ngModel)]="subject" />
            </mat-form-field>
            <br />
            <div
              class="editor-container editor-container_classic-editor"
              #editorContainerElement
            >
              <div class="editor-container__editor">
                <div #editorElement>
                  <ckeditor
                    [editor]="Editor"
                    [config]="config"
                    *ngIf="isLayoutReady"
                  />
                </div>
              </div>
            </div>
            <div class="button-container">
              <button
                mat-raised-button
                color="primary"
                (click)="saveTemplate()"
              >
                Save Template
              </button>
            </div>
          </div>
        </div>
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>
</mat-card>
