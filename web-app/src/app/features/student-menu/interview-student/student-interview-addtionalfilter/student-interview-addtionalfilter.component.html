<mat-dialog-content>
  <div style="display: flex; justify-content: space-between">
    <mat-label class="mat-label">Additional Filters</mat-label>
    <mat-icon mat-button mat-dialog-close style="cursor: pointer"
      >cancel</mat-icon
    >
  </div>
  <p>Company</p>
  <mat-form-field class="full-width" appearance="outline">
    <mat-label>Select Companies</mat-label>
    <mat-select
      [formControl]="companyControl"
      multiple
      (openedChange)="onCompanyDropdownOpen()"
    >
      <mat-select-trigger>
        {{ selectedCompanyNames }}
      </mat-select-trigger>
      <mat-form-field appearance="outline">
        <!-- <mat-label>Add</mat-label> -->
        <input
          class="full-width"
          matInput
          [(ngModel)]="searchCompany"
          (ngModelChange)="filterCompanies($event)"
          placeholder="Search"
        />
      </mat-form-field>
      <mat-option *ngIf="!filteredCompanies.length" disabled
        >No options</mat-option
      >
      <mat-option
        *ngFor="let company of filteredCompanies"
        [value]="company.Name"
      >
        {{ company.Name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <p>Interview Rounds</p>
  <div>
    <mat-form-field appearance="outline" class="filter-field full-width">
      <mat-label>Interview Rounds</mat-label>
      <mat-select [formControl]="interviewRoundControl" multiple>
        <mat-option *ngFor="let ir of interviewRounds" [value]="ir">{{
          ir
        }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

<mat-dialog-actions
  class="mat-dialog-actions"
  style="background-color: lightgray"
>
